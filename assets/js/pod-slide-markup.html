

<div class="ps-wrap" id="psWrap">
<div class="ps-rail" aria-hidden="true"><i class="ps-bar"></i></div>
<section class="hero hero--classic" id="hero">
  <span class="glow glow-amber"></span>
  <span class="glow glow-teal"></span>
  <div class="ribbon-wrap" id="ribbonWrap"><div class="ribbon" id="ribbon"></div></div>

  <div class="inner">

    <p class="eyebrow ps-reveal" data-reveal style="--i:0">How a pod runs</p>
    <h1 class="head ps-reveal" data-reveal style="--i:1">Five stages, one calendar.</h1>
      <p class="lede ps-reveal" data-reveal style="--i:2">Stages run your month. Gates approve each deliverable.</p>
    <div class="underline ps-reveal" id="underline" data-reveal style="--i:2"></div>

    <div class="tabbar ps-reveal" data-reveal style="--i:3">
      <div class="tabs" id="tabs" role="tablist" aria-label="Pod stages">
        <span class="pill" id="pill"></span>
      </div>
    </div>

    <div class="stage ps-reveal" data-reveal style="--i:4">
      <div class="col-left" id="colLeft"></div>

      <div class="col-right" id="colRight">
        <!-- orbit rings: .orbit positions, .orbit-turn takes the tab angle, .orbit-spin runs forever -->
        <div class="orbit o1"><div class="orbit-turn"><div class="orbit-spin">
          <div class="ring"></div><span class="dot dot-a"></span>
        </div></div></div>
        <div class="orbit o2"><div class="orbit-turn"><div class="orbit-spin">
          <div class="ring"></div><span class="dot dot-a"></span><span class="dot dot-b"></span>
        </div></div></div>
        <div class="orbit o3"><div class="orbit-turn"><div class="orbit-spin">
          <div class="ring"></div><span class="dot dot-a"></span>
        </div></div></div>

        <div class="chip rise" id="chip"><span class="star">✦</span><span id="chipText">Open the brief</span></div>

        <div class="circle" id="circle">
          <div class="circle-spin" id="circleSpin"><span class="knob"></span></div>
          <div class="circle-face" id="face">IN</div>
        </div>

        <div class="cards" id="cards"></div>
      </div>
    </div>

  </div>
</section>
</div><!-- /.ps-wrap -->
